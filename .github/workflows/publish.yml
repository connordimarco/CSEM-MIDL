name: Publish to PyPI

# Build the package and publish it to PyPI whenever a GitHub Release is
# published. Uses PyPI Trusted Publishing (OIDC) -- no API token or secret
# to manage. The version comes from __version__ in midl/__init__.py via
# hatchling, so it always matches the released code.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/csem-midl
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
